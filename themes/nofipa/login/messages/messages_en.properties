# Login form i18n overrides for the nofipa theme.
#
# Every CRM user is provisioned with username == email (see
# crm/keycloak_user_service.py:create_user). The CRM display_name field
# is purely cosmetic and CANNOT be used to sign in, so the default
# Keycloak label "Username or email" is misleading. Override the small
# set of strings that mention "username" so the login form, the error
# message, and the password-reset form all consistently say "email".
#
# Keys come from Keycloak's stock login theme (themes/base/login/messages
# /messages_en.properties in the Keycloak distribution). Only override
# what we need; everything else falls through to the parent theme.

usernameOrEmail=Email
username=Email
invalidUserMessage=Invalid email or password.
invalidEmailMessage=Invalid email address.
emailInstruction=Enter your email address and we will send you instructions on how to create a new password.
